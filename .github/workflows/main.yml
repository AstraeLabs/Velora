name: Build & Update Binaries

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:

          # ── Windows
          - target:     x86_64-pc-windows-msvc
            os:         windows-latest
            artifact:   Velora.exe
            asset_name: velora-win-x64.exe

          - target:     aarch64-pc-windows-msvc
            os:         windows-latest
            artifact:   Velora.exe
            asset_name: velora-win-arm64.exe

          # ── macOS
          - target:     x86_64-apple-darwin
            os:         macos-latest
            artifact:   Velora
            asset_name: velora-osx-x64
            macos_deployment_target: "10.13"

          - target:     aarch64-apple-darwin
            os:         macos-latest
            artifact:   Velora
            asset_name: velora-osx-arm64

          # ── Linux (musl – fully static, works on any glibc/musl version)
          - target:     x86_64-unknown-linux-musl
            os:         ubuntu-latest
            artifact:   Velora
            asset_name: velora-linux-x64
            cross:      true

          - target:     aarch64-unknown-linux-musl
            os:         ubuntu-latest
            artifact:   Velora
            asset_name: velora-linux-arm64
            cross:      true

          # ── Linux (musl – fully static binary, duplicate asset name kept for compatibility)
          - target:     x86_64-unknown-linux-musl
            os:         ubuntu-latest
            artifact:   Velora
            asset_name: velora-linux-musl-x64
            cross:      true

          # ── Android / Termux
          - target:     aarch64-linux-android
            os:         ubuntu-latest
            artifact:   Velora
            asset_name: velora-termux-arm64
            cross:      true

          - target:     armv7-linux-androideabi
            os:         ubuntu-latest
            artifact:   Velora
            asset_name: velora-termux-arm
            cross:      true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross == true
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Install NASM (Windows BoringSSL build)
        if: contains(matrix.target, 'windows-msvc')
        run: choco install nasm -y

      - name: Build (cargo)
        if: matrix.cross != true
        shell: bash
        env:
          RUSTFLAGS: ${{ contains(matrix.target, 'windows-msvc') && '-C target-feature=+crt-static' || '' }}
        run: |
          if [ -n "${{ matrix.macos_deployment_target }}" ]; then
            export MACOSX_DEPLOYMENT_TARGET="${{ matrix.macos_deployment_target }}"
          fi
          cargo build --release --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.cross == true
        shell: bash
        env:
          ANDROID_NDK_HOME: /android-ndk
        run: |
          cross build --release --target ${{ matrix.target }}

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          src="target/${{ matrix.target }}/release/${{ matrix.artifact }}"
          dst="dist/${{ matrix.asset_name }}"
          cp "$src" "$dst"
          ls -lh dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}
          retention-days: 1

  update-release:
    name: Update release assets
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List built binaries
        run: ls -lh dist/

      - name: Upload / overwrite release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: init
          files: dist/*
          fail_on_unmatched_files: true