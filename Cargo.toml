[package]
name = "velora"
version = "2.1.1"
edition = "2021"

[[bin]]
name = "Velora"
path = "src/main.rs"

[features]
default = []

[dependencies]
tokio = { version = "1",  features = ["full"] }
wreq = { version = "0.16", features = ["socks", "stream"] }
wreq-util = "0.2"
serde = { version = "1",  features = ["derive"] }
serde_json = "1"
futures = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
bytes = "1"
rand = "0.8"
anyhow = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"